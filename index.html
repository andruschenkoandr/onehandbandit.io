<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Однорукий бандит</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="game-container">
        <header class="header">
            <p class="subtitle">★---CASINO---★</p>
            <h1>ОДНОРУКИЙ БАНДИТ</h1>
            <p class="description">Перевір свою удачу!</p>
        </header>

        <section class="player-panel">
            <div class="player-info">
                <span class="info-label">ГРАВЕЦЬ</span>
                <span class="player-name" id="playerName">Гравець</span>
            </div>
            <div class="attempt-info">
                <span class="info-label">СПРОБИ</span>
                <span class="attempt-count" id="attemptCount">0 / 3</span>
            </div>
        </section>

        <section class="machine-wrapper">
            <section class="slot-machine">
                <div class="machine-top">
                    <span>★ LUCKY SEVEN ★</span>
                </div>
                <div class="reels" id="reels">

                    <div class="reel-column">
                        <div class="slot" id="slot0"></div>
                        <div class="slot" id="slot1"></div>
                        <div class="slot" id="slot2"></div>
                    </div>

                    <div class="reel-column">
                        <div class="slot" id="slot3"></div>
                        <div class="slot" id="slot4"></div>
                        <div class="slot" id="slot5"></div>
                    </div>

                    <div class="reel-column">
                        <div class="slot" id="slot6"></div>
                        <div class="slot" id="slot7"></div>
                        <div class="slot" id="slot8"></div>
                    </div>
                </div>
                <div class="machine-bottom">
                    <span>GOOD LUCK!</span>
                </div>
            </section>
            <div class="lever-area" id="leverArea">
                <div class="lever-base"></div>
                <div class="lever" id="lever">
                    <div class="lever-stick"></div>
                    <div class="lever-ball"></div>
                </div>
            </div>
        </section>

        <section class="game-controls">
            <p class="lever-instruction">
                ПОТЯГНИ ЗА РУЧКУ, ЩОБ ПОЧАТИ ГРУ
            </p>
            <p class="game-message" id="gameMessage">
                Випробуй свою удачу!
            </p>
        </section>
		
        <section class="rules">
            <h2>ПРАВИЛА ГРИ</h2>
            <p>1) У тебе є три спроби</p>
            <p>2) Три однакові символи в горизонтальному ряду = перемога.</p>
        </section>
        <footer>
            <p>LUCKY SEVEN</p>
        </footer>
    </main>
</body>
</html>
